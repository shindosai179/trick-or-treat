<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whack-a-Ghost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf3e6; --card:#fffdf8; --ink:#2b1d3a; --muted:#6d5f7a;
  --orange:#e8731c; --purple:#6b3fa0; --purple-l:#efe6fa;
  --good:#2f7d4f; --good-l:#e4f4ea; --bad:#b3261e; --bad-l:#fbe7e5; --line:#e6d9c4;
  --grass:#7aa35a; --soil:#8a6a4a; --stone:#b9b3c2; --stone-d:#8a8494;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
body{display:flex;justify-content:center;padding:12px 16px}
.wrap{width:100%;max-width:860px}
.pix{font-family:"Press Start 2P",monospace}
header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
header h1{font-size:15px;margin:0;color:var(--purple);line-height:1.4}
.hud{margin-left:auto;display:flex;gap:14px;align-items:center;font-weight:800}
.hud .v{font-family:"Press Start 2P",monospace;font-size:14px;color:var(--orange)}
.hud .mult{background:var(--purple);color:#fff;border-radius:6px;padding:3px 7px;font-size:12px;visibility:hidden}
.hud .mult.on{visibility:visible}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:100%;background:var(--orange)}

.field{position:relative;border:2px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;
  background:linear-gradient(#eadff5 0,#f7efe3 55%,#f7efe3 100%);padding:10px 10px 0;
  display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px}
.field.slow{background:linear-gradient(#d9e8f7 0,#eef4fb 55%,#eef4fb 100%)}
.moon{position:absolute;right:22px;top:14px;opacity:.9}
.hole{position:relative;height:196px}
.pit{position:absolute;left:0;right:0;top:0;bottom:34px;overflow:hidden}
.stone{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:118px;height:66px;z-index:3;
  background:var(--stone);border:3px solid var(--ink);border-bottom:none;border-radius:44px 44px 0 0;
  display:flex;align-items:flex-start;justify-content:center;padding-top:12px;font-size:10px;color:var(--stone-d)}
.hole::after{content:"";position:absolute;left:-10px;right:-10px;bottom:0;height:12px;background:var(--grass);border-top:3px solid #5b8441;z-index:4}

.fig{position:absolute;left:50%;bottom:20px;width:168px;transform:translate(-50%,130%);transition:transform .22s ease-out;
  display:flex;flex-direction:column;align-items:center;cursor:pointer;touch-action:manipulation;user-select:none}
.fig.up{transform:translate(-50%,0)}
.sign{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:6px 8px;font-size:13px;font-weight:800;
  line-height:1.25;text-align:center;width:100%;min-height:50px;display:flex;flex-direction:column;justify-content:center;box-shadow:2px 2px 0 var(--ink)}
.sign b{font-family:"Press Start 2P",monospace;font-size:9px;margin-top:4px}
.sign.good{background:var(--good-l);border-color:var(--good)} .sign.good b{color:var(--good)}
.sign.bad{background:var(--bad-l);border-color:var(--bad)} .sign.bad b{color:var(--bad)}
.k-p .sign{background:#fff4cf;border-color:#c99a12}
.spr{margin-top:4px;height:66px;display:flex;align-items:flex-end}
.fig:hover .sign{transform:translateY(-1px)}
.flyoff{animation:flyoff .6s ease-in forwards}
@keyframes flyoff{to{transform:translateY(-70px) rotate(10deg);opacity:0}}
.hole.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.hole.flash .pit{background:rgba(179,38,30,.15)}

.float{position:absolute;left:50%;top:38%;z-index:6;white-space:nowrap;pointer-events:none;font-family:"Press Start 2P",monospace;font-size:12px;
  transform:translateX(-50%);animation:floatUp .9s ease-out forwards;text-shadow:2px 2px 0 #fff}
.float.good{color:var(--good)} .float.bad{color:var(--bad)} .float.meh{color:var(--muted)} .float.gold{color:#b9860b}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
.bit{position:absolute;width:9px;height:9px;z-index:5;pointer-events:none;animation:bit .6s ease-out forwards}
@keyframes bit{to{transform:translate(var(--dx),var(--dy));opacity:0}}

.panel{position:relative;grid-column:1/-1;z-index:10;display:flex;justify-content:center;padding:14px 0 24px}
.field.menu .hole{display:none}
.panel[hidden]{display:none}
.box{background:var(--card);border:2px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);padding:18px 20px;max-width:640px;width:100%}
.box h2{margin:0 0 10px;font-size:16px;color:var(--purple);line-height:1.5}
.why{font-size:15px;line-height:1.45;margin:0 0 12px}
.rules{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;font-size:15px;line-height:1.35}
.btn{font:inherit;font-weight:800;font-size:16px;cursor:pointer;background:var(--orange);color:#fff;border:2px solid var(--ink);border-radius:8px;
  box-shadow:3px 3px 0 var(--ink);padding:11px 18px;margin-top:14px;width:100%}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.big{font-size:26px;color:var(--orange);margin:6px 0}
.rank{font-size:19px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips span{background:var(--purple-l);color:var(--purple);border-radius:20px;padding:3px 10px;font-size:13px;font-weight:800}
.review{font-size:14px;line-height:1.4;margin:6px 0 0;padding-left:18px}
.review li{margin-bottom:6px}
.lesson{font-size:14px;color:var(--muted);margin-top:8px}
.decoder{margin-top:10px;min-height:46px;background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:7px 12px;font-size:14px;line-height:1.35;color:var(--muted)}
.decoder b.ok{color:var(--good)} .decoder b.no{color:var(--bad)}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
svg{display:block;image-rendering:pixelated}

@media (max-width:600px){
  .field{grid-template-columns:repeat(2,1fr)}
  .hole{height:178px}
  .fig{width:142px} .sign{font-size:12px}
  header h1{font-size:11px} .hud{gap:8px} .hud .v{font-size:11px}
}
/* Animations off (common on BMA laptops): no movement, but everything still appears and fades. */
@media (prefers-reduced-motion:reduce){
  .fig{transform:translate(-50%,0);opacity:0;transition:opacity .15s}
  .fig.up{opacity:1}
  .flyoff{animation:fade .6s forwards}
  .hole.shake{animation:none}
  .float{animation:fade .9s forwards}
  .bit{display:none}
}
@keyframes fade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span id="hdrIcon"></span>
    <h1 class="pix">WHACK-A-GHOST</h1>
    <div class="hud">
      <span class="mult" id="mult">x2</span>
      <span>Score <span class="v" id="score">0</span></span>
      <span>Time <span class="v" id="time">45</span></span>
    </div>
  </header>
  <div class="bar"><i id="bar"></i></div>
  <div class="field" id="field">
    <span class="moon" id="moon"></span>
    <div class="panel" id="panel"></div>
  </div>
  <div class="decoder" id="decoder">Read each label. The real-life meaning appears here after you make your call.</div>
  <div class="foot">October edition from the Cyber Risk team. Your score stays in your browser; nobody sees it.</div>
</div>

<script>
// ---------- pixel art, drawn in code ----------
function pixel(rows, colors, size){
  var w = rows[0].length, h = rows.length, r = '';
  for (var y=0; y<h; y++) for (var x=0; x<w; x++){
    var c = colors[rows[y][x]];
    if (c) r += '<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+c+'"/>';
  }
  return '<svg width="'+size+'" height="'+(size*h/w)+'" viewBox="0 0 '+w+' '+h+'" shape-rendering="crispEdges" aria-hidden="true">'+r+'</svg>';
}
var ART = {
  pumpkin:[["......g.....",".....gg.....","..oooooooo..",".oooooooooo.","ooKKooooKKoo","ooKKooooKKoo","oooooKKooooo","ooKKKKKKKKoo","oooKoKKoKooo",".oooooooooo.","..oooooooo.."],
           {g:'#3f7a2a',o:'#e8731c',K:'#3b1d0a'}],
  ghost:[["...LLLLLL...","..LwwwwwwL..",".LwwwwwwwwL.",".LwKKwwKKwL.",".LwKKwwKKwL.",".LwwwwwwwwL.",".LwwwKKwwwL.",".LwwwwwwwwL.",".LwwwwwwwwL.",".LwLwwLwwLwL",".L.L.LL.L.L."],
         {L:'#6b3fa0',w:'#ffffff',K:'#2b1d3a'}],
  sheet:[["....SSSS....","..SSWWWWSS..",".SWWWWWWWWS.",".SWWKWWKWWS.",".SWWKWWKWWS.","SWWWWWWWWWWS","SWWWWWWWWWWS","SWWWWWWWWWWS","SWWWWWWWWWWS","SWWWWWWWWWWS","SWSWWSWWSWWS","S.S..S..S..S"],
         {S:'#8a8494',W:'#f4f1ea',K:'#2b1d3a'}],
  phone:[["..YYYYYYYY..",".YYYYYYYYYY.","YYKKYYYYKKYY","YYKKYYYYKKYY","...YYYYYY...","..YYYYYYYY..","..YKYKYKYY..","..YYKYKYKY..","..YKYKYKYY..","..YYYYYYYY.."],
         {Y:'#f6c344',K:'#2b1d3a'}],
  moon:[["...MMMM...",".MMMMMMMM.",".MMMMMmMM.","MMMMMMMMMM","MMmMMMMMMM","MMMMMMMmMM","MMMMMMMMMM",".MMMmMMMM.",".MMMMMMMM.","...MMMM..."],
        {M:'#fde9b8',m:'#f6d78f'}]
};
function art(name, size){ return pixel(ART[name][0], ART[name][1], size); }
document.getElementById('hdrIcon').innerHTML = art('ghost', 34);
document.getElementById('moon').innerHTML = art('moon', 46);

// ---------- the files ----------
// k: g = ghost control (whack it), r = real evidence (leave it), p = golden phone (hit it)
// Labels are plain-English Halloween analogies. The real-world meaning (w) is shown only after the call.
var ITEMS = [
 {k:'g', t:'Rulebook: every crypt needs two keys', w:'A rulebook is not a lock. Real life: a policy saying logins need a second check (a code on your phone) proves nothing until you see the system settings.'},
 {k:'g', t:'Mummies wrapped every night: all ticked', w:'Wrapped is not the same as able to walk out. Real life: backups that ran are not backups that restore. Ask for a restore test.'},
 {k:'g', t:'"We count the zombies regularly"', w:'"Regularly", with no tally sheet, is a ghost. Real life: an access review with no record of who was removed.'},
 {k:'g', t:'Vampire plan, never rehearsed', w:'A plan nobody has practised is a story. Real life: an incident response plan that has never been tested.'},
 {k:'g', t:'Ghost hunters booked for next year', w:'A booking is not a result. Real life: a security test that has not happened yet.'},
 {k:'g', t:'The council has "heard of" the curse', w:'Hearing is not overseeing. Real life: a board "aware" of cyber risk, with no minutes showing it challenged anything.'},
 {k:'g', t:'"The landlord handles our ghosts"', w:'You can rent out the house, not the haunting. Real life: outsourcing to a cloud provider does not move accountability.'},
 {k:'g', t:'The witch who cast the spell checked it', w:'Marking your own homework. Real life: an auditor reviewing controls they designed is not independent.'},
 {k:'g', t:'The coffin seller swears it is sealed', w:'A seller\'s word is not proof. Real life: a supplier\'s say-so instead of their assurance report.'},
 {k:'g', t:'Garlic on most of the windows', w:'Vampires use the window you missed. Real life: data protected "where possible" means not everywhere.'},
 {k:'g', t:'Digital asset curse? Report in 72 hours', w:'Wrong clock. Real life: a digital asset business notifies the Authority within 24 hours. 72 hours is the insurers\' deadline.'},
 {k:'g', t:'Graveyard map: "mostly complete"', w:'The ghost lives in the grave missing from the map. Real life: an incomplete list of the systems you have to protect.'},
 {k:'g', t:'Ghost-spotting leaflet pinned up', w:'Pinned up is not learned. Real life: training slides posted, no sign anyone took them in.'},
 {k:'g', t:'Escape plan last updated 2019', w:'Real life: a business continuity plan nobody has touched in years.'},
 {k:'g', t:'Monster list: blank template', w:'Real life: a risk register with no risks, owners or dates in it.'},
 {k:'g', t:'Strange noise? Wait and see', w:'When in doubt, call. Real life: if you are unsure whether an incident is reportable, consult the Authority.'},
 {k:'g', t:'Castle gate rules "checked"', w:'Checked by whom, and when? Real life: network access rules "reviewed" with no record of it.'},
 {k:'g', t:'Annual séance: "ongoing" since May', w:'Ongoing is not finished. Real life: an annual review that never gets completed.'},
 {k:'r', t:'Gatekeeper\'s log: all 41 doors double-locked', w:'Proof from the gate itself. Real life: a system report showing the second login check is on for every administrator.'},
 {k:'r', t:'Mummy unwrapped, walked out in 6 hours', w:'Real life: a restore test from backup, timed and written up. That is proof it works.'},
 {k:'r', t:'Zombie count: 14 found and removed', w:'Real life: an access review that found 14 people who had left and removed them, signed off.'},
 {k:'r', t:'Vampire drill run: 5 lessons logged', w:'Real life: an incident exercise, with follow-up actions recorded.'},
 {k:'r', t:'Ghost hunters found 3 holes: all sealed', w:'Real life: a security test whose findings were fixed and tracked to closure.'},
 {k:'r', t:'Council minutes: the curse was debated', w:'Real life: board minutes showing real challenge on cyber risk.'},
 {k:'r', t:'Landlord\'s inspection report checked', w:'Real life: reviewing the outsourced provider\'s assurance report. Oversight on file.'},
 {k:'r', t:'Outside witch-finder: 4 findings', w:'Real life: an independent audit, separate from what it checks.'},
 {k:'r', t:'Insurer reported the curse in 48 hours', w:'Real life: insurers have 72 hours to notify the Authority. Inside the window.'},
 {k:'r', t:'Digital asset firm reported in 20 hours', w:'Real life: inside the digital asset 24-hour clock.'},
 {k:'r', t:'Fake-ghost test: only 4% fooled', w:'Real life: phishing tests showing fewer staff clicking. Training that works.'},
 {k:'r', t:'Escape drill passed in March', w:'Real life: a business continuity test, with a date and a result.'},
 {k:'r', t:'Monster list: every one has a hunter', w:'Real life: a risk register with named owners and deadlines.'},
 {k:'r', t:'Cracks in the walls: 97% filled in a month', w:'Real life: a report from the systems showing security fixes applied on time.'}
];
var PHONE = {k:'p', t:'Strange noise? Call the Authority', w:'When in doubt, consult the Authority. Calling early buys you time to get it right.'};

// ---------- game state ----------
var GAME_MS = 45000, HOLES = 6;
var field = document.getElementById('field'), panel = document.getElementById('panel');
var holes = [], pool = [], running = false, t0 = 0, spawnTimer = null, clock = null, slowUntil = 0;
var score, combo, mult, stats, mistakes;

for (var n=0; n<HOLES; n++){
  var h = document.createElement('div');
  h.className = 'hole';
  h.innerHTML = '<div class="pit"></div><div class="stone pix">RIP</div>';
  field.appendChild(h);
  holes.push({el:h, pit:h.querySelector('.pit'), item:null, done:true, timer:null});
}

function draw(){
  if (!pool.length){
    pool = ITEMS.slice();
    for (var i=pool.length-1; i>0; i--){ var j = Math.floor(Math.random()*(i+1)), x = pool[i]; pool[i] = pool[j]; pool[j] = x; }
  }
  return pool.pop();
}
function progress(){ return Math.min(1, (Date.now()-t0)/GAME_MS); }
function slow(){ return Date.now() < slowUntil ? 1.7 : 1; }
function life(){ return (3000 - 1100*progress())*slow(); }       // how long a file stays up
function gap(){ return (1150 - 450*progress())*slow(); }         // time between files
function maxUp(){ return progress() < 0.3 ? 2 : 3; }

function hud(){
  document.getElementById('score').textContent = score;
  var m = document.getElementById('mult');
  m.textContent = 'x'+mult; m.className = 'mult' + (mult > 1 ? ' on' : '');
}
function float(h, text, cls){
  var f = document.createElement('div');
  f.className = 'float '+cls; f.textContent = text;
  h.el.appendChild(f); setTimeout(function(){ f.remove(); }, 950);
}
function puff(h, cols){
  for (var i=0; i<14; i++){
    var b = document.createElement('i'), a = Math.random()*Math.PI*2, d = 30 + Math.random()*50;
    b.className = 'bit';
    b.style.left = '50%'; b.style.top = '55%';
    b.style.background = cols[i % cols.length];
    b.style.setProperty('--dx', Math.cos(a)*d+'px'); b.style.setProperty('--dy', Math.sin(a)*d+'px');
    h.el.appendChild(b); setTimeout(function(e){ return function(){ e.remove(); }; }(b), 650);
  }
}

function spawn(){
  if (!running) return;
  var free = holes.filter(function(h){ return !h.item; });
  if (HOLES - free.length < maxUp() && free.length){
    var h = free[Math.floor(Math.random()*free.length)];
    var item = (progress() > 0.15 && Math.random() < 0.07) ? PHONE : draw();
    h.item = item; h.done = false;
    h.pit.innerHTML = '<div class="fig k-'+item.k+'"><div class="sign">'+item.t+'</div><div class="spr">'+
      (item.k === 'p' ? art('phone', 56) : art('sheet', 60))+'</div></div>';
    var fig = h.pit.firstChild;
    fig.addEventListener('pointerdown', function(e){ e.preventDefault(); whack(h); });
    setTimeout(function(){ fig.classList.add('up'); }, 20);
    h.timer = setTimeout(function(){ escape(h); }, life());
  }
  spawnTimer = setTimeout(spawn, gap());
}

function reveal(h, sprite, verdict, cls){
  var fig = h.pit.firstChild; if (!fig) return;
  var sign = fig.querySelector('.sign');
  sign.className = 'sign '+cls;
  sign.insertAdjacentHTML('beforeend', '<b>'+verdict+'</b>');
  fig.querySelector('.spr').innerHTML = art(sprite, 60);
}
function clearHole(h, delay){
  setTimeout(function(){
    var fig = h.pit.firstChild;
    if (fig) fig.classList.remove('up');
    setTimeout(function(){ h.pit.innerHTML = ''; h.item = null; }, 230);
  }, delay);
}

function decode(ok, it){
  var d = document.getElementById('decoder');
  d.innerHTML = '<b class="'+(ok ? 'ok' : 'no')+'">'+(ok ? 'Right call.' : 'Wrong call.')+'</b> "'+it.t+'" was '+(it.k === 'g' ? 'ghost evidence' : it.k === 'r' ? 'real evidence' : 'the right call')+'. '+it.w;
}

function whack(h){
  if (!running || !h.item || h.done) return;
  h.done = true; clearTimeout(h.timer);
  var it = h.item;
  decode(it.k !== 'r', it);
  if (it.k === 'g'){
    combo++; mult = Math.min(3, 1 + Math.floor(combo/3));
    var pts = 10*mult; score += pts; stats.caught++;
    reveal(h, 'ghost', 'GHOST EVIDENCE', 'good');
    h.pit.querySelector('.spr svg').classList.add('flyoff');
    float(h, '+'+pts, 'good'); puff(h, ['#6b3fa0','#ffffff','#efe6fa']);
  } else if (it.k === 'r'){
    combo = 0; mult = 1; score = Math.max(0, score-15); stats.wrongWhack++;
    mistakes.push({how:'You whacked real evidence', it:it});
    reveal(h, 'pumpkin', 'REAL EVIDENCE!', 'bad');
    float(h, '-15', 'bad');
    h.el.classList.add('shake','flash'); setTimeout(function(){ h.el.classList.remove('shake','flash'); }, 450);
  } else {
    combo++; score += 10; stats.called++;
    var bonus;
    if (Math.random() < 0.5){ t0 += 5000; bonus = '+5 SECONDS'; }
    else { slowUntil = Date.now() + 6000; bonus = 'SLOW-MO'; }
    reveal(h, 'phone', bonus, 'good');
    float(h, bonus, 'gold'); puff(h, ['#f6c344','#e8731c','#ffffff']);
  }
  hud(); clearHole(h, 700);
}

function escape(h){
  if (!running || !h.item || h.done) return;
  h.done = true;
  var it = h.item;
  if (it.k !== 'r') decode(false, it);
  if (it.k === 'g'){
    combo = 0; mult = 1; score = Math.max(0, score-5); stats.escaped++;
    mistakes.push({how:'Ghost evidence slipped past you', it:it});
    reveal(h, 'ghost', 'GHOST GOT AWAY', 'bad');
    h.pit.querySelector('.spr svg').classList.add('flyoff');
    float(h, '-5', 'bad');
    clearHole(h, 650);
  } else if (it.k === 'r'){
    score += 3; stats.accepted++;
    float(h, '+3', 'meh');
    clearHole(h, 0);
  } else {
    stats.missedCall++;
    mistakes.push({how:'You let the phone ring out', it:it});
    clearHole(h, 0);
  }
  hud();
}

function tick(){
  var left = Math.max(0, GAME_MS - (Date.now()-t0));
  document.getElementById('time').textContent = Math.ceil(left/1000);
  document.getElementById('bar').style.width = Math.min(100, left/GAME_MS*100)+'%';
  field.classList.toggle('slow', running && Date.now() < slowUntil);
  if (left <= 0) end();
}

function start(){
  score = 0; combo = 0; mult = 1; mistakes = []; slowUntil = 0; field.classList.remove('slow');
  stats = {caught:0, escaped:0, wrongWhack:0, accepted:0, called:0, missedCall:0};
  holes.forEach(function(h){ clearTimeout(h.timer); h.pit.innerHTML = ''; h.item = null; h.done = true; });
  document.getElementById('decoder').textContent = 'Read each label. The real-life meaning appears here after you make your call.';
  panel.hidden = true; field.classList.remove('menu'); running = true; t0 = Date.now(); hud(); tick();
  clock = setInterval(tick, 100);
  spawnTimer = setTimeout(spawn, 500);
}

var RANKS = [
  [0,  'Possessed by paperwork', 'The ghosts had a field day. Read the case review below and have another go.'],
  [60, 'Apprentice ghost hunter', 'You can spot a ghost in good light. Some still slipped past.'],
  [80, 'Seasoned exorcist', 'Very few paper controls get past you.'],
  [95, 'Chief exorcist', 'Ruthless with ghosts, fair to real evidence. Exactly the balance.']
];

function pl(n, w){ return n+' '+w+(n === 1 ? '' : 's'); }

function end(){
  running = false; clearInterval(clock); clearTimeout(spawnTimer);
  holes.forEach(function(h){ clearTimeout(h.timer); h.pit.innerHTML = ''; h.item = null; });
  var right = stats.caught + stats.accepted + stats.called;
  var total = right + stats.escaped + stats.wrongWhack + stats.missedCall;
  var acc = total ? Math.round(right/total*100) : 0;
  var r = RANKS[0]; RANKS.forEach(function(x){ if (acc >= x[0]) r = x; });

  var seen = {}, review = mistakes.filter(function(m){ if (seen[m.it.t]) return false; seen[m.it.t] = 1; return true; }).slice(0, 4);
  var list = review.length
    ? '<ul class="review">'+review.map(function(m){ return '<li><b>'+m.how+':</b> '+m.it.t+'. '+m.it.w+'</li>'; }).join('')+'</ul>'
    : '<p style="margin:6px 0">Not a single mistake. Nothing to review.</p>';

  panel.innerHTML = '<div class="box">'+
    '<h2 class="pix">CASE REVIEW</h2>'+
    '<div class="big pix">'+score+'</div>'+
    '<div class="rank">'+r[1]+' &middot; '+acc+'% right calls</div><div>'+r[2]+'</div>'+
    '<div class="chips"><span>Ghost evidence caught: '+stats.caught+'</span><span>Real evidence spared: '+stats.accepted+'</span>'+
      '<span>Ghost evidence missed: '+stats.escaped+'</span><span>Real evidence whacked: '+stats.wrongWhack+'</span>'+
      (stats.called ? '<span>'+pl(stats.called,'right call')+'</span>' : '')+'</div>'+
    (review.length ? '<b>Files to look at again</b>' : '')+list+
    '<div class="lesson">The question behind every file: <b>is this real evidence that it works, or ghost evidence that only says it should?</b></div>'+
    '<button class="btn" id="go">Play again</button></div>';
  panel.hidden = false; field.classList.add('menu');
  document.getElementById('go').onclick = start;
}

panel.innerHTML = '<div class="box">'+
  '<h2 class="pix">TONIGHT, YOU DO OUR JOB</h2>'+
  '<p class="why">The companies we supervise tell us how well they are protected against cyber attacks. '+
  'Some of what they send is <b>real evidence</b>: proof that a protection actually works. Some is <b>ghost evidence</b>: just a promise, like a "Beware of the dog" sign with no dog behind the gate. '+
  'Our job is telling the two apart. For the next 45 seconds, it\'s yours.</p>'+
  '<div class="rules">'+
    art('sheet', 34)+'<span>Files climb out of the graves <b>under a sheet</b>. Read each label.</span>'+
    art('ghost', 34)+'<span><b>Ghost evidence?</b> A promise, a plan or a "trust us". <b>Whack it!</b></span>'+
    art('pumpkin', 34)+'<span><b>Real evidence?</b> Proof that something works. <b>Leave it alone</b>, or you lose points.</span>'+
    art('phone', 34)+'<span><b>Golden phone?</b> Hit it for <b>extra time</b> or <b>slow motion</b>. Calling us early always buys time.</span>'+
  '</div>'+
  '<p class="why" style="margin:10px 0 0">After each call, the bar under the graveyard tells you what the spooky label means in real life.</p>'+
  '<button class="btn" id="go">Start: 45 seconds</button></div>';
field.classList.add('menu');
document.getElementById('go').onclick = start;
</script>
